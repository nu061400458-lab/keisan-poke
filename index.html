<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>たしざん・ひきざん</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>

/* =========================================================
   基本設定
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

body {
    font-family: "Zen Maru Gothic", sans-serif;
    background: #fff7d6;
    color: #5d4b3b;
    -webkit-tap-highlight-color: transparent;
}

button {
    font-family: inherit;
    border: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}


/* =========================================================
   アプリ全体
========================================================= */

.app {
    width: 100%;
    height: 100dvh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: clamp(8px, 1.5vh, 16px);
}

.screen {
    width: min(1500px, 100%);
    height: 100%;
    min-height: 0;
}


/* =========================================================
   ホーム画面
========================================================= */

.home-screen {
    height: 100%;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    gap: clamp(30px, 6vh, 70px);
}

.title {
    margin: 0;

    text-align: center;

    font-size: clamp(40px, 6vw, 78px);
    font-weight: 900;
    line-height: 1.2;

    color: #ff7b7b;

    text-shadow:
        3px 3px 0 #fff,
        5px 5px 0 rgba(255, 190, 100, 0.35);
}

.mode-buttons {
    width: min(800px, 90%);

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 30px;
}

.mode-button {
    min-height: clamp(140px, 24vh, 230px);

    border-radius: 38px;

    font-size: clamp(32px, 5vw, 58px);
    font-weight: 900;

    color: white;

    box-shadow:
        0 9px 0 rgba(0, 0, 0, 0.08);

    transition: transform 0.12s ease;
}

.mode-button:active {
    transform: translateY(5px);

    box-shadow:
        0 4px 0 rgba(0, 0, 0, 0.08);
}

.addition-button {
    background: #ff9f68;
}

.subtraction-button {
    background: #72bdf5;
}


/* =========================================================
   ゲーム画面
========================================================= */

.game-screen {
    height: 100%;
    min-height: 0;

    display: flex;
    flex-direction: column;

    gap: clamp(3px, 0.5vh, 7px);

    padding-bottom: clamp(6px, 1vh, 12px);
}


/* =========================================================
   ヘッダー
========================================================= */

.game-header {
    flex: 0 0 auto;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 12px;
}

.mode-title {
    margin: 0;

    font-size: clamp(28px, 3.8vw, 48px);
    font-weight: 900;

    color: #ff8b5c;
}

.header-buttons {
    display: flex;
    gap: 8px;
}

.header-button {
    min-width: clamp(120px, 14vw, 180px);

    height: clamp(42px, 6vh, 56px);

    padding: 0 18px;

    border-radius: 18px;

    font-size: clamp(17px, 2vw, 23px);
    font-weight: 700;

    color: white;

    box-shadow:
        0 4px 0 rgba(0, 0, 0, 0.08);
}

.skip-button {
    background: #ffb45f;
}

.home-button {
    background: #8ecf88;
}

.header-button:active {
    transform: translateY(3px);

    box-shadow:
        0 1px 0 rgba(0, 0, 0, 0.08);
}


/* =========================================================
   問題エリア
========================================================= */

.question-area {
    flex: 1 1 auto;

    min-height: 0;

    display: flex;
    flex-direction: column;

    justify-content: center;

    gap: clamp(2px, 0.5vh, 8px);
}


/* =========================================================
   数式
========================================================= */

.equation {
    width: 100%;

    display: flex;

    justify-content: center;
    align-items: center;

    flex-wrap: nowrap;

    gap: clamp(12px, 2vw, 34px);
}


/* =========================================================
   数字＋ポケモンのカード
========================================================= */

.number-group,
.answer-group {

    /*
     * 数字とポケモンを
     * 同じまとまりとして認識できるようにする
     */
    flex: 0 1 auto;

    min-width: 0;

    width: clamp(230px, 24vw, 330px);

    padding:
        clamp(8px, 1.2vh, 14px)
        clamp(8px, 1.2vw, 16px)
        clamp(10px, 1.5vh, 18px);

    border-radius: clamp(24px, 2.5vw, 36px);

    background: rgba(255, 255, 255, 0.92);

    border: clamp(3px, 0.35vw, 5px) solid #f6dca4;

    box-shadow:
        0 8px 0 rgba(170, 130, 70, 0.10),
        0 4px 18px rgba(130, 100, 50, 0.08);

    display: flex;
    flex-direction: column;

    align-items: center;

    justify-content: flex-start;
}


/* 答えカード */

.answer-group {
    border-color: #ffd27d;

    background: #fffdf5;
}


/* =========================================================
   数字
========================================================= */

.number {

    width: 100%;

    height: clamp(70px, 10vh, 105px);

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: clamp(64px, 8vw, 100px);
    font-weight: 900;

    line-height: 1;

    color: #5d4b3b;
}


/* 答え数字 */

.answer-number {

    width: 100%;

    height: clamp(70px, 10vh, 105px);

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: clamp(64px, 8vw, 100px);
    font-weight: 900;

    line-height: 1;

    color: #5d4b3b;

    border-radius: 18px;
}

.answer-number.correct {

    color: #55a96c;

}


/* =========================================================
   ポケモン
========================================================= */

.pokemon-grid {

    /*
     * 3×3グリッド全体を大型化
     */
    width: clamp(185px, 19vw, 260px);
    height: clamp(185px, 19vw, 260px);

    display: grid;

    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);

    gap: clamp(1px, 0.25vw, 5px);

    justify-items: center;
    align-items: center;

    margin-top: clamp(2px, 0.3vh, 5px);
}

.pokemon-item {

    /*
     * 1匹ずつも大型化
     */
    width: clamp(58px, 6.2vw, 82px);
    height: clamp(58px, 6.2vw, 82px);

    display: flex;

    justify-content: center;
    align-items: center;
}

.pokemon-item img {

    width: 100%;
    height: 100%;

    object-fit: contain;

    image-rendering: pixelated;
}

.pokemon-fallback {

    width: 75%;
    height: 75%;

    border-radius: 50%;

    background: #ffe38e;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: clamp(26px, 3vw, 42px);
}


/* =========================================================
   演算子
========================================================= */

.operator,
.equal {

    flex: 0 0 auto;

    width: clamp(42px, 4vw, 68px);

    height: clamp(90px, 12vh, 125px);

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: clamp(56px, 7vw, 86px);
    font-weight: 900;

    color: #6b5845;
}


/* =========================================================
   メッセージ
========================================================= */

.message {

    flex: 0 0 auto;

    min-height: clamp(38px, 5vh, 58px);

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: clamp(27px, 3.7vw, 42px);
    font-weight: 900;

    color: #ff7777;
}

.message.success {
    color: #62b978;
}


/* =========================================================
   回答ボタン
========================================================= */

.answer-area {

    flex: 0 0 auto;

    width: 100%;

    display: flex;

    justify-content: center;

    margin-top: 0;
}

.answer-buttons {

    width: min(1250px, 100%);

    display: grid;

    grid-template-columns: repeat(9, 1fr);

    gap: clamp(7px, 0.9vw, 13px);
}

.answer-button {

    width: 100%;

    /*
     * ボタン自体のサイズ・配置は従来のまま
     */
    aspect-ratio: 1 / 0.78;

    min-width: 0;

    border-radius: clamp(14px, 1.5vw, 22px);

    background: #fff;

    color: #5d4b3b;

    box-shadow:
        0 5px 0 #e4d6b7,
        inset 0 0 0 3px #fff;

    /*
     * ボタンサイズは変えず、
     * 数字だけ大きく
     */
    font-size: clamp(32px, 3.8vw, 50px);
    font-weight: 900;

    line-height: 1;

    transition:
        transform 0.1s ease,
        box-shadow 0.1s ease;
}

.answer-button:active:not(:disabled) {

    transform: translateY(4px);

    box-shadow:
        0 1px 0 #e4d6b7,
        inset 0 0 0 3px #fff;
}

.answer-button:disabled {

    opacity: 0.55;

    cursor: default;
}


/* =========================================================
   次の問題エリア
   ※最初から高さを確保
========================================================= */

.next-area {

    flex: 0 0 auto;

    height: clamp(54px, 7vh, 70px);

    display: flex;

    justify-content: center;
    align-items: center;

    padding-bottom: clamp(4px, 1vh, 10px);
}

.next-area.hidden {

    display: flex !important;

    visibility: hidden;
}

.next-button {

    min-width: min(420px, 80%);

    height: clamp(48px, 6vh, 62px);

    border-radius: 20px;

    background: #ff8d8d;

    color: white;

    font-size: clamp(21px, 3vw, 29px);
    font-weight: 900;

    box-shadow:
        0 5px 0 rgba(0, 0, 0, 0.08);
}

.next-button:active {

    transform: translateY(4px);

    box-shadow:
        0 1px 0 rgba(0, 0, 0, 0.08);
}


/* =========================================================
   非表示
========================================================= */

.hidden {
    display: none !important;
}


/*
 * next-areaだけは例外
 */
.next-area.hidden {
    display: flex !important;
    visibility: hidden;
}


/* =========================================================
   高さが小さい画面
========================================================= */

@media (max-height: 760px) {

    .app {
        padding: 5px 10px;
    }

    .game-screen {
        gap: 2px;
        padding-bottom: 5px;
    }

    .game-header {
        min-height: 38px;
    }

    .mode-title {
        font-size: 25px;
    }

    .header-button {

        height: 38px;

        min-width: 110px;

        padding: 0 12px;

        font-size: 15px;

        border-radius: 14px;
    }


    /* カードを少しコンパクトに */

    .number-group,
    .answer-group {

        width: clamp(180px, 24vw, 250px);

        padding:
            5px
            5px
            7px;

        border-radius: 22px;
    }

    .number {

        height: 52px;

        font-size: 55px;
    }

    .answer-number {

        height: 52px;

        font-size: 55px;
    }

    .operator,
    .equal {

        width: 38px;

        height: 60px;

        font-size: 48px;
    }

    .pokemon-grid {

        width: 150px;
        height: 150px;

        margin-top: 2px;
    }

    .pokemon-item {

        width: 46px;
        height: 46px;
    }

    .message {

        min-height: 30px;

        font-size: 23px;
    }

    .answer-button {

        font-size: 29px;
    }

    .next-area {

        height: 48px;
    }

    .next-button {

        height: 40px;

        font-size: 19px;
    }
}


/* =========================================================
   さらに高さが小さい画面
========================================================= */

@media (max-height: 650px) {

    .number-group,
    .answer-group {

        width: clamp(155px, 22vw, 210px);

        padding: 3px 4px 5px;

        border-radius: 18px;
    }

    .number {

        height: 40px;

        font-size: 43px;
    }

    .answer-number {

        height: 40px;

        font-size: 43px;
    }

    .operator,
    .equal {

        width: 32px;

        height: 48px;

        font-size: 38px;
    }

    .pokemon-grid {

        width: 112px;
        height: 112px;
    }

    .pokemon-item {

        width: 34px;
        height: 34px;
    }

    .message {

        min-height: 24px;

        font-size: 19px;
    }

    .answer-button {

        font-size: 25px;

        border-radius: 10px;
    }

    .next-area {

        height: 42px;
    }

    .next-button {

        height: 35px;

        font-size: 17px;
    }
}


/* =========================================================
   スマートフォン
========================================================= */

@media (max-width: 600px) {

    .app {
        padding: 5px;
    }

    .game-header {
        gap: 5px;
    }

    .mode-title {
        font-size: 21px;
    }

    .header-buttons {
        gap: 4px;
    }

    .header-button {

        min-width: auto;

        padding: 0 9px;

        font-size: 14px;

        border-radius: 13px;
    }


    /* -----------------------------------------
       スマートフォン用カード
    ----------------------------------------- */

    .equation {

        gap: 3px;

        width: 100%;
    }

    .number-group,
    .answer-group {

        /*
         * 横幅の限られたスマホでも
         * 3枚のカードを横一列に維持
         */
        width: clamp(92px, 28vw, 145px);

        padding: 4px 2px 5px;

        border-width: 2px;

        border-radius: 18px;
    }

    .number {

        height: clamp(42px, 8vh, 58px);

        font-size: clamp(43px, 11vw, 60px);
    }

    .answer-number {

        height: clamp(42px, 8vh, 58px);

        font-size: clamp(43px, 11vw, 60px);
    }

    .operator,
    .equal {

        width: clamp(22px, 6vw, 34px);

        height: clamp(48px, 9vh, 68px);

        font-size: clamp(34px, 9vw, 50px);
    }


    /* -----------------------------------------
       ポケモン
    ----------------------------------------- */

    .pokemon-grid {

        width: clamp(88px, 25vw, 135px);

        height: clamp(88px, 25vw, 135px);

        gap: 0;
    }

    .pokemon-item {

        width: clamp(29px, 8vw, 43px);

        height: clamp(29px, 8vw, 43px);
    }


    .message {

        font-size: clamp(21px, 6vw, 30px);
    }


    /* -----------------------------------------
       回答ボタン
       サイズは従来のまま
       数字だけ大型化
    ----------------------------------------- */

    .answer-buttons {

        gap: 3px;
    }

    .answer-button {

        aspect-ratio: 1 / 0.82;

        border-radius: 9px;

        font-size: clamp(22px, 6vw, 31px);

        box-shadow:
            0 3px 0 #e4d6b7;
    }

    .next-area {

        height: 50px;
    }

}


/* =========================================================
   極端に横幅が狭い場合
========================================================= */

@media (max-width: 420px) {

    .header-button {

        padding: 0 7px;
    }

    .equation {

        gap: 1px;
    }

    .number-group,
    .answer-group {

        width: 25.5vw;

        padding: 3px 1px 4px;

        border-radius: 15px;
    }

    .number {

        height: 38px;

        font-size: 37px;
    }

    .answer-number {

        height: 38px;

        font-size: 37px;
    }

    .operator,
    .equal {

        width: 18px;

        height: 44px;

        font-size: 29px;
    }

    .pokemon-grid {

        width: 22vw;

        height: 22vw;
    }

    .pokemon-item {

        width: 6.8vw;

        height: 6.8vw;
    }

    .answer-buttons {

        gap: 2px;
    }

    .answer-button {

        font-size: 20px;
    }

}


/* =========================================================
   非常に低い画面 × スマートフォン
========================================================= */

@media (max-width: 600px) and (max-height: 650px) {

    .number-group,
    .answer-group {

        width: 25vw;

        padding: 2px 1px 3px;

        border-radius: 13px;
    }

    .number {

        height: 32px;

        font-size: 32px;
    }

    .answer-number {

        height: 32px;

        font-size: 32px;
    }

    .operator,
    .equal {

        width: 17px;

        height: 38px;

        font-size: 26px;
    }

    .pokemon-grid {

        width: 20vw;

        height: 20vw;
    }

    .pokemon-item {

        width: 6.2vw;

        height: 6.2vw;
    }

    .answer-button {

        font-size: 18px;
    }
}

</style>
</head>


<body>

<div class="app">


    <!-- =====================================================
         ホーム画面
    ====================================================== -->

    <section
        id="homeScreen"
        class="screen home-screen">

        <h1 class="title">
            たしざん・ひきざん
        </h1>

        <div class="mode-buttons">

            <button
                id="additionButton"
                class="mode-button addition-button">
                たしざん
            </button>

            <button
                id="subtractionButton"
                class="mode-button subtraction-button">
                ひきざん
            </button>

        </div>

    </section>


    <!-- =====================================================
         ゲーム画面
    ====================================================== -->

    <section
        id="gameScreen"
        class="screen game-screen hidden">


        <!-- ヘッダー -->

        <header class="game-header">

            <h2
                id="modeTitle"
                class="mode-title">
                たしざん
            </h2>

            <div class="header-buttons">

                <button
                    id="skipButton"
                    class="header-button skip-button">
                    べつのもんだい
                </button>

                <button
                    id="homeButton"
                    class="header-button home-button">
                    ホーム
                </button>

            </div>

        </header>


        <!-- =================================================
             問題
        ================================================== -->

        <main class="question-area">

            <div class="equation">


                <!-- =========================================
                     左：数字＋ポケモン
                ========================================== -->

                <div class="number-group">

                    <div
                        id="leftNumber"
                        class="number">
                        1
                    </div>

                    <div
                        id="leftPokemonGrid"
                        class="pokemon-grid">
                    </div>

                </div>


                <!-- 演算子 -->

                <div
                    id="operator"
                    class="operator">
                    ＋
                </div>


                <!-- =========================================
                     右：数字＋ポケモン
                ========================================== -->

                <div class="number-group">

                    <div
                        id="rightNumber"
                        class="number">
                        1
                    </div>

                    <div
                        id="rightPokemonGrid"
                        class="pokemon-grid">
                    </div>

                </div>


                <!-- イコール -->

                <div class="equal">
                    ＝
                </div>


                <!-- =========================================
                     答え：数字＋ポケモン
                ========================================== -->

                <div class="answer-group">

                    <div
                        id="answerNumber"
                        class="answer-number">
                        ？
                    </div>

                    <div
                        id="answerPokemonGrid"
                        class="pokemon-grid">
                    </div>

                </div>

            </div>


            <!-- メッセージ -->

            <div
                id="message"
                class="message">
            </div>

        </main>


        <!-- =================================================
             回答ボタン
        ================================================== -->

        <div class="answer-area">

            <div
                id="answerButtons"
                class="answer-buttons">

                <button
                    class="answer-button"
                    data-answer="1">
                    1
                </button>

                <button
                    class="answer-button"
                    data-answer="2">
                    2
                </button>

                <button
                    class="answer-button"
                    data-answer="3">
                    3
                </button>

                <button
                    class="answer-button"
                    data-answer="4">
                    4
                </button>

                <button
                    class="answer-button"
                    data-answer="5">
                    5
                </button>

                <button
                    class="answer-button"
                    data-answer="6">
                    6
                </button>

                <button
                    class="answer-button"
                    data-answer="7">
                    7
                </button>

                <button
                    class="answer-button"
                    data-answer="8">
                    8
                </button>

                <button
                    class="answer-button"
                    data-answer="9">
                    9
                </button>

            </div>

        </div>


        <!-- =================================================
             次の問題
             ※最初からスペースを確保
        ================================================== -->

        <div
            id="nextArea"
            class="next-area hidden">

            <button
                id="nextButton"
                class="next-button">
                つぎのもんだい
            </button>

        </div>


    </section>

</div>


<script>

/* =========================================================
   状態
========================================================= */

const state = {

    mode: null,

    left: 1,

    right: 1,

    answer: 1,

    pokemonId: 25,

    solved: false,

    previousQuestionKey: null,

    questionId: 0

};


/* =========================================================
   DOM
========================================================= */

const homeScreen =
    document.getElementById("homeScreen");

const gameScreen =
    document.getElementById("gameScreen");

const additionButton =
    document.getElementById("additionButton");

const subtractionButton =
    document.getElementById("subtractionButton");

const homeButton =
    document.getElementById("homeButton");

const skipButton =
    document.getElementById("skipButton");

const nextButton =
    document.getElementById("nextButton");

const modeTitle =
    document.getElementById("modeTitle");

const leftNumber =
    document.getElementById("leftNumber");

const rightNumber =
    document.getElementById("rightNumber");

const operator =
    document.getElementById("operator");

const answerNumber =
    document.getElementById("answerNumber");

const leftPokemonGrid =
    document.getElementById("leftPokemonGrid");

const rightPokemonGrid =
    document.getElementById("rightPokemonGrid");

const answerPokemonGrid =
    document.getElementById("answerPokemonGrid");

const message =
    document.getElementById("message");

const answerButtons =
    document.querySelectorAll(".answer-button");

const nextArea =
    document.getElementById("nextArea");


/* =========================================================
   イベント
========================================================= */

additionButton.addEventListener(
    "click",
    () => startGame("addition")
);

subtractionButton.addEventListener(
    "click",
    () => startGame("subtraction")
);

homeButton.addEventListener(
    "click",
    showHome
);

skipButton.addEventListener(
    "click",
    generateQuestion
);

nextButton.addEventListener(
    "click",
    generateQuestion
);

answerButtons.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            const selectedAnswer =
                Number(button.dataset.answer);

            checkAnswer(selectedAnswer);

        }
    );

});


/* =========================================================
   ゲーム開始
========================================================= */

function startGame(mode) {

    state.mode = mode;

    state.previousQuestionKey = null;

    state.questionId++;

    homeScreen.classList.add("hidden");

    gameScreen.classList.remove("hidden");

    modeTitle.textContent =
        mode === "addition"
            ? "たしざん"
            : "ひきざん";

    generateQuestion();

}


/* =========================================================
   ホーム
========================================================= */

function showHome() {

    state.questionId++;

    state.mode = null;

    state.solved = false;

    gameScreen.classList.add("hidden");

    homeScreen.classList.remove("hidden");

    message.textContent = "";

    message.className = "message";

    nextArea.classList.add("hidden");

    clearPokemonGrid(leftPokemonGrid);

    clearPokemonGrid(rightPokemonGrid);

    clearPokemonGrid(answerPokemonGrid);

}


/* =========================================================
   問題生成
========================================================= */

function generateQuestion() {

    if (!state.mode) {
        return;
    }

    state.questionId++;

    state.solved = false;

    message.textContent = "";

    message.className = "message";

    /*
     * 次の問題ボタンは非表示にするが、
     * nextArea自体は常に存在するため
     * 画面レイアウトは動かない。
     */
    nextArea.classList.add("hidden");

    answerNumber.textContent = "？";

    answerNumber.classList.remove("correct");

    clearPokemonGrid(answerPokemonGrid);

    enableAnswerButtons();


    let left;

    let right;

    let answer;

    let questionKey;


    do {

        if (state.mode === "addition") {

            /*
             * たしざん
             * 1〜9のみ
             * こたえも1〜9
             * くりあがりなし
             */

            left =
                randomInt(1, 8);

            right =
                randomInt(
                    1,
                    9 - left
                );

            answer =
                left + right;

        } else {

            /*
             * ひきざん
             * 1〜9のみ
             * こたえも1〜9
             * 0にはならない
             */

            left =
                randomInt(2, 9);

            right =
                randomInt(
                    1,
                    left - 1
                );

            answer =
                left - right;

        }


        questionKey =
            `${state.mode}-${left}-${right}`;

    } while (
        questionKey ===
        state.previousQuestionKey
    );


    state.left = left;

    state.right = right;

    state.answer = answer;

    state.pokemonId =
        randomPokemonId();

    state.previousQuestionKey =
        questionKey;


    /* 数字 */

    leftNumber.textContent =
        state.left;

    rightNumber.textContent =
        state.right;


    /* 演算子 */

    operator.textContent =
        state.mode === "addition"
            ? "＋"
            : "－";


    /* ポケモン */

    renderPokemonGroup(
        leftPokemonGrid,
        state.left,
        state.pokemonId
    );

    renderPokemonGroup(
        rightPokemonGrid,
        state.right,
        state.pokemonId
    );

}


/* =========================================================
   回答
========================================================= */

function checkAnswer(selectedAnswer) {

    if (state.solved) {
        return;
    }

    if (
        selectedAnswer ===
        state.answer
    ) {

        handleCorrect();

    } else {

        handleIncorrect();

    }

}


/* =========================================================
   正解
========================================================= */

function handleCorrect() {

    state.solved = true;

    answerNumber.textContent =
        state.answer;

    answerNumber.classList.add(
        "correct"
    );

    message.textContent =
        "せいかい！";

    message.className =
        "message success";

    disableAnswerButtons();

    renderPokemonGroup(
        answerPokemonGrid,
        state.answer,
        state.pokemonId
    );

    /*
     * nextAreaはもともと同じ高さを確保しているので、
     * ここで表示しても他の要素が動かない。
     */
    nextArea.classList.remove(
        "hidden"
    );

    playCorrectSound();

}


/* =========================================================
   不正解
========================================================= */

function handleIncorrect() {

    message.textContent =
        "おしい！";

    message.className =
        "message";

    playIncorrectSound();


    setTimeout(() => {

        if (!state.solved) {

            message.textContent = "";

        }

    }, 900);

}


/* =========================================================
   ボタン制御
========================================================= */

function disableAnswerButtons() {

    answerButtons.forEach(
        button => {
            button.disabled = true;
        }
    );

}


function enableAnswerButtons() {

    answerButtons.forEach(
        button => {
            button.disabled = false;
        }
    );

}


/* =========================================================
   ポケモン
========================================================= */

function renderPokemonGroup(
    container,
    count,
    pokemonId
) {

    clearPokemonGrid(container);


    const currentQuestionId =
        state.questionId;


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const item =
            document.createElement("div");

        item.className =
            "pokemon-item";


        const img =
            document.createElement("img");

        img.alt = "";


        img.src =
            `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemonId}.png`;


        img.addEventListener(
            "error",
            () => {

                if (
                    state.questionId !==
                    currentQuestionId
                ) {
                    return;
                }

                item.innerHTML =
                    '<div class="pokemon-fallback">★</div>';

            },
            {
                once: true
            }
        );


        item.appendChild(img);

        container.appendChild(item);

    }

}


function clearPokemonGrid(container) {

    container.innerHTML = "";

}


/* =========================================================
   ランダム
========================================================= */

function randomInt(
    min,
    max
) {

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;

}


function randomPokemonId() {

    return randomInt(1, 151);

}


/* =========================================================
   効果音
========================================================= */

let audioContext = null;


function getAudioContext() {

    try {

        if (!audioContext) {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            if (!AudioContext) {
                return null;
            }

            audioContext =
                new AudioContext();

        }


        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext
                .resume()
                .catch(() => {});

        }


        return audioContext;

    } catch (error) {

        return null;

    }

}


function playTone(
    frequency,
    duration,
    type = "sine"
) {

    const ctx =
        getAudioContext();

    if (!ctx) {
        return;
    }


    try {

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();


        oscillator.type =
            type;

        oscillator.frequency.value =
            frequency;


        gain.gain.setValueAtTime(
            0.0001,
            ctx.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.12,
            ctx.currentTime + 0.01
        );


        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            ctx.currentTime + duration
        );


        oscillator.connect(gain);

        gain.connect(
            ctx.destination
        );


        oscillator.start();


        oscillator.stop(
            ctx.currentTime +
            duration
        );

    } catch (error) {

        /*
         * 音声の失敗は
         * ゲームに影響させない
         */

    }

}


function playCorrectSound() {

    playTone(
        523.25,
        0.12,
        "sine"
    );


    setTimeout(
        () => {

            playTone(
                659.25,
                0.12,
                "sine"
            );

        },
        100
    );


    setTimeout(
        () => {

            playTone(
                783.99,
                0.18,
                "sine"
            );

        },
        200
    );

}


function playIncorrectSound() {

    playTone(
        220,
        0.16,
        "triangle"
    );

}


/* =========================================================
   初期状態
========================================================= */

homeScreen.classList.remove(
    "hidden"
);

gameScreen.classList.add(
    "hidden"
);

</script>
